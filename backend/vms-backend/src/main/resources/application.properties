# Uygulama Bilgileri
quarkus.application.name=vms-backend

# HTTP Yapılandırması
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS

# Veritabanı Yapılandırması - PostgreSQL Dev Services
# Quarkus dev modda çalıştırıldığında PostgreSQL Docker konteynırını otomatik başlatır.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:16-alpine
quarkus.datasource.devservices.db-name=vms_db
quarkus.datasource.devservices.username=vms_user
quarkus.datasource.devservices.password=vms_password

# Hibernate ORM Yapılandırması
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql
